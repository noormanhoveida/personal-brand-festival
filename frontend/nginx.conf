server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # فعال‌سازی فشرده‌سازی برای کاهش حجم لود تا ۷۰ درصد
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml font/woff font/woff2 application/font-woff;

    # کش قدرتمند فونت‌ها و فایل‌های استاتیک
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # مسیر اصلی SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
